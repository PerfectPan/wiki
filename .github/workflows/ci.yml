name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Check PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: bash tests/pr-title.sh

      - name: Run wiki CLI tests
        run: bash tests/wiki-cli.sh

      - name: Test wording checks
        run: node --test tests/check-jargon.test.ts

      - name: Check wording in PR changes
        if: github.event_name == 'pull_request'
        env:
          JARGON_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: ./bin/wiki check-jargon --base "$JARGON_BASE_REF"

      - name: Check frontmatter
        run: ./bin/wiki check

      - name: Check prompts
        run: ./bin/wiki prompts check
