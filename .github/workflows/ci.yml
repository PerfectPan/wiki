name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: PR metadata
        if: github.event_name == 'pull_request'
        run: node tests/pr-metadata.mjs

      - name: Run wiki CLI tests
        run: bash tests/wiki-cli.sh

      - name: Check frontmatter
        run: ./bin/wiki check

      - name: Check prompts
        run: ./bin/wiki prompts check
